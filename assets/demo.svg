<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">notes CLI and TUI example</title>
  <desc id="desc">A sample terminal session beside the notes editor, with the search and editor panes aligned at the right edge.</desc>
  <rect width="1200" height="520" rx="20" fill="#11111b"/>
  <text x="28" y="42" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="20" font-weight="700">Plain files. Quick commands. A focused editor.</text>
  <text x="1173" y="40" text-anchor="end" fill="#6c7086" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">EXAMPLE SESSION</text>

  <rect x="24" y="68" width="526" height="424" rx="14" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <path d="M38 69h498a13 13 0 0 1 13 13v26H25V82a13 13 0 0 1 13-13Z" fill="#181825"/>
  <path d="M25 108h524" stroke="#45475a"/>
  <circle cx="47" cy="89" r="5" fill="#f38ba8"/>
  <circle cx="65" cy="89" r="5" fill="#f9e2af"/>
  <circle cx="83" cy="89" r="5" fill="#a6e3a1"/>
  <text x="110" y="94" fill="#a6adc8" font-family="Arial, sans-serif" font-size="13" font-weight="700">CLI</text>
  <text x="526" y="94" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="11">notes</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="45" y="143" fill="#a6e3a1">$ <tspan fill="#cdd6f4">notes n "Release" --path work/release.md</tspan></text>
    <text x="45" y="166" fill="#a6adc8">/home/you/.config/notes/repo/work/release.md</text>
    <text x="45" y="205" fill="#a6e3a1">$ <tspan fill="#cdd6f4">notes j a "Ship v1" --section actions</tspan></text>
    <text x="45" y="228" fill="#a6adc8">/home/you/.config/notes/repo/journal/2026/09/2026-09-28.md</text>
    <text x="45" y="267" fill="#a6e3a1">$ <tspan fill="#cdd6f4">notes l</tspan></text>
    <text x="45" y="290" fill="#89b4fa">base: <tspan fill="#cdd6f4">/home/you/.config/notes/repo</tspan></text>
    <text x="45" y="313" fill="#cdd6f4">/work/release.md</text>
    <text x="45" y="336" fill="#cdd6f4">/journal/2026/09/2026-09-28.md</text>
    <text x="45" y="375" fill="#a6e3a1">$ <tspan fill="#cdd6f4">notes co rend</tspan></text>
    <text x="45" y="398" fill="#a6adc8">theme = 'catppuccin-mocha'</text>
    <text x="45" y="437" fill="#a6e3a1">$ <tspan fill="#cdd6f4">notes t work/release.md</tspan></text>
    <text x="45" y="462" fill="#cba6f7">↳ editor opens with the note focused</text>
  </g>

  <rect x="566" y="68" width="610" height="424" rx="14" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <path d="M580 69h582a13 13 0 0 1 13 13v26H567V82a13 13 0 0 1 13-13Z" fill="#181825"/>
  <path d="M567 108h608" stroke="#45475a"/>
  <circle cx="589" cy="89" r="5" fill="#f38ba8"/>
  <circle cx="607" cy="89" r="5" fill="#f9e2af"/>
  <circle cx="625" cy="89" r="5" fill="#a6e3a1"/>
  <text x="652" y="94" fill="#a6adc8" font-family="Arial, sans-serif" font-size="13" font-weight="700">TUI</text>
  <text x="1152" y="94" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="11">catppuccin-mocha</text>

  <rect x="586" y="123" width="570" height="60" rx="8" fill="#1e1e2e" stroke="#585b70" stroke-width="2"/>
  <text x="601" y="145" fill="#a6adc8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Search all notes</text>
  <text x="601" y="169" fill="#6c7086" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Type to search…</text>

  <rect x="586" y="195" width="170" height="246" rx="8" fill="#1e1e2e" stroke="#585b70" stroke-width="2"/>
  <text x="601" y="219" fill="#a6adc8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Tags / notes</text>
  <g fill="#cdd6f4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="600" y="251" fill="#89b4fa">› all (2)</text>
    <text x="602" y="279" fill="#cba6f7">#shipping (1)</text>
    <text x="602" y="307">work</text>
    <text x="616" y="335">release.md</text>
    <text x="602" y="363">journal</text>
  </g>

  <rect x="756" y="195" width="400" height="246" rx="8" fill="#1e1e2e" stroke="#cba6f7" stroke-width="2"/>
  <text x="771" y="219" fill="#cba6f7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">work/release.md [FOCUS]</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="773" y="251" fill="#6c7086">1  <tspan fill="#89b4fa"># Release</tspan></text>
    <text x="773" y="279" fill="#6c7086">2</text>
    <text x="773" y="307" fill="#6c7086">3  <tspan fill="#cdd6f4">Ship v1. </tspan><tspan fill="#cba6f7">#shipping</tspan></text>
    <text x="773" y="335" fill="#6c7086">4</text>
    <text x="773" y="363" fill="#6c7086">5  <tspan fill="#a6e3a1">- [x] Build binaries</tspan></text>
    <text x="773" y="391" fill="#6c7086">6  <tspan fill="#cdd6f4">- [ ] Update docs</tspan></text>
    <text x="773" y="419" fill="#6c7086">7  <tspan fill="#cdd6f4">- [ ] Publish release</tspan></text>
  </g>
  <text x="586" y="463" fill="#cba6f7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">Editor VIM NORMAL</text>
  <text x="719" y="463" fill="#a6adc8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">· Opened work/release.md</text>
  <text x="586" y="483" fill="#a6adc8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">Ctrl+G n New · Ctrl+G c Settings · Ctrl+G h Help · Tab Focus</text>
</svg>
